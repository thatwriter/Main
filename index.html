<!DOCTYPE html>
<html>

<head>
    <title>Lector QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        video {
            width: 100%;
            max-width: 500px;
            margin: 10px 0;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <h1>Lector QR</h1>
    <video id="video" playsinline></video>
    <div id="result">Escaneando...</div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                video.play();
                requestAnimationFrame(tick);
            });

        // Función de ofuscación
        function ofuscarNumero(numeroStr) {
            const sustitucion = {
                '0': '7',
                '1': '8',
                '2': '9',
                '3': '0',
                '4': '1',
                '5': '2',
                '6': '3',
                '7': '4',
                '8': '5',
                '9': '6'
            };
            return numeroStr.split('').map(digito => sustitucion[digito] || digito).join('');
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    const contenido = code.data;
                    resultDiv.innerHTML = `<p>QR encontrado: <strong>${contenido}</strong></p>`;

                    // Analizar el formato CONF-XXX-YYY
                    const partes = contenido.split('-');
                    if (partes[0] === 'CONF' && partes.length >= 3) {
                        const idBoleto = partes[1];
                        const asistentesEsperados = partes[2];

                        const idOfuscado = ofuscarNumero(idBoleto);
                        const asistentesOfuscados = ofuscarNumero(asistentesEsperados);

                        resultDiv.innerHTML += `<p>ID Boleto Original: ${idBoleto}</p>`;
                        resultDiv.innerHTML += `<p>ID Boleto Ofuscado: ${idOfuscado}</p>`;
                        resultDiv.innerHTML += `<p>Asistentes Esperados Original: ${asistentesEsperados}</p>`;
                        resultDiv.innerHTML += `<p>Asistentes Esperados Ofuscados: ${asistentesOfuscados}</p>`;

                        // Enviar al servidor de PythonAnywhere
                        fetch('https://edgarabyss.pythonanywhere.com/api/qr', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ contenido: contenido })
                        })
                            .then(response => response.json())
                            .then(data => {
                                console.log("Respuesta del servidor:", data);
                                resultDiv.innerHTML += `<p>✅ Enviado al servidor</p>`;
                            })
                            .catch(error => {
                                console.error("Error al enviar:", error);
                                resultDiv.innerHTML += `<p>❌ Error al enviar: ${error.message}</p>`;
                            });
                    } else {
                        resultDiv.innerHTML += `<p>❌ Formato de QR no reconocido. Debe ser CONF-XXX-YYY</p>`;
                    }
                }
            }
            requestAnimationFrame(tick);
        }
    </script>
</body>

</html>
