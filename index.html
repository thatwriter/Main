<!DOCTYPE html>
<html>

<head>
    <title>Lector QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #video {
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }
        #result {
            margin: 10px 0;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <h1>Formulario de Asistencia</h1>
    
    <form id="asistenciaForm">
        <div class="form-group">
            <label for="qrData">Código QR:</label>
            <video id="video" width="100%"></video>
            <div id="result">No se ha detectado ningún código QR</div>
            <input type="hidden" id="qrData" name="qrData" required>
        </div>
        
        <div class="form-group">
            <label for="asistentes_reales">Número de Asistentes:</label>
            <input type="number" id="asistentes_reales" name="asistentes_reales" placeholder="Ingrese número de asistentes" required>
        </div>
        
        <button type="submit" id="submitBtn" disabled>Enviar Asistencia</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');
        const qrDataInput = document.getElementById('qrData');
        const submitBtn = document.getElementById('submitBtn');
        let qrDetected = false;

        // Acceder a la cámara
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                video.play();
                requestAnimationFrame(tick);
            })
            .catch(err => {
                console.error("Error al acceder a la cámara:", err);
                resultDiv.innerHTML = "Error al acceder a la cámara: " + err.message;
            });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code && !qrDetected) {
                    resultDiv.innerHTML = `QR detectado: ${code.data}`;
                    qrDataInput.value = code.data;
                    qrDetected = true;
                    submitBtn.disabled = false; // Habilitar botón de envío
                }
            }
            requestAnimationFrame(tick);
        }

        // Manejar el envío del formulario
        document.getElementById('asistenciaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Extraer el ID del boleto del código QR
            const qrCode = qrDataInput.value;
            const partes = qrCode.split('-');
            let id_boleto = '';
            
            if (partes[0] === 'CONF' && partes.length >= 3) {
                id_boleto = partes[1]; // El ID del boleto es la segunda parte
            } else {
                alert("Formato de QR no válido");
                return;
            }
            
            const formData = {
                id_boleto: qrCode,
                asistentes_reales: document.getElementById('asistentes_reales').value
            };
            
            // Enviar al servidor de PythonAnywhere
            fetch('https://edgarabyss.pythonanywhere.com/api/qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                console.log("Respuesta del servidor:", data);
                if(data.status === "OK") {
                    alert("Asistencia registrada exitosamente");
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => {
                console.error("Error al enviar:", error);
                alert("Error al registrar la asistencia");
            });
        });
    </script>
</body>

</html>
